<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Remote">
<link rel="icon" href="data:,">
<title>Laptop Remote</title>
<style>
  :root {
    --bg: #111418;
    --card: #1b2027;
    --button: #262d36;
    --button-pressed: #343d49;
    --text: #eef1f5;
    --muted: #9aa5b3;
    --accent: #4f9cf9;
    --green: #3fb97a;
    --red: #e5534b;
    --orange: #e49b3b;
    --border: #2f3742;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px; line-height: 1.35;
    padding: max(14px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 2px 14px; }
  header h1 { font-size: 20px; margin: 0; }
  header small { color: var(--muted); display: block; font-size: 13px; margin-top: 2px; }
  .status { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status.error { background: var(--red); }

  section { background: var(--card); border-radius: 18px; padding: 14px; margin-bottom: 14px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px 4px; font-weight: 600; }

  .row { display: grid; gap: 10px; grid-template-columns: repeat(3, 1fr); }
  .row.two { grid-template-columns: repeat(2, 1fr); }

  button {
    font: inherit; color: var(--text); background: var(--button);
    border: 1px solid var(--border); border-radius: 14px;
    min-height: 80px; padding: 10px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; touch-action: manipulation;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    transition: transform .06s, background .1s;
  }
  button:active, button.held { background: var(--button-pressed); transform: scale(.96); }
  button:disabled { opacity: .5; }
  button svg { width: 34px; height: 34px; fill: currentColor; flex: none; }
  button span { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.2; }
  button.big svg { width: 42px; height: 42px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary span { color: #e6f0ff; }
  button.danger { color: var(--red); }
  button.warn { color: var(--orange); }

  .programs { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
  .programs button { min-height: 66px; font-size: 16px; font-weight: 600; padding: 10px; text-align: center; word-break: break-word; }
  .empty { color: var(--muted); font-size: 15px; margin: 4px; }
  .notes { color: var(--orange); font-size: 13px; margin: 10px 4px 0; }
  .notes:empty { display: none; }

  textarea, input[type=text] {
    width: 100%; font: inherit; font-size: 18px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  }
  textarea { min-height: 110px; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .options { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
  .options label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; }
  .options input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); }
  .options button { min-height: 56px; flex-direction: row; padding: 0 24px; font-weight: 600; }

  /* PIN screen */
  #pinScreen { display: none; min-height: 80vh; flex-direction: column; justify-content: center; }
  #pinScreen.visible { display: flex; }
  #pinScreen h1 { font-size: 24px; margin: 0 0 6px; }
  #pinScreen p { color: var(--muted); margin: 0 0 18px; }
  #pinInput { text-align: center; font-size: 30px; letter-spacing: .3em; }
  #pinScreen button { width: 100%; margin-top: 12px; min-height: 58px; font-weight: 600; }
  #pinError { color: var(--red); min-height: 24px; margin-top: 12px; text-align: center; }
  #main { display: none; }
  #main.visible { display: block; }

  /* Short messages */
  #toast {
    position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 30px);
    background: #2b333e; color: var(--text); padding: 12px 18px; border-radius: 12px;
    width: max-content; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: .2s; text-align: center;
    box-shadow: 0 6px 24px rgba(0,0,0,.4); z-index: 20;
  }
  #toast.visible { opacity: 1; transform: translate(-50%, 0); }
  #toast.error { background: #6a2724; }

  /* Confirmation for shut down and restart */
  #confirm { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: flex-end; justify-content: center; padding: 16px; z-index: 10; }
  #confirm.visible { display: flex; }
  #confirm .box { background: var(--card); border-radius: 20px; padding: 20px; width: 100%; max-width: 520px; margin-bottom: env(safe-area-inset-bottom); }
  #confirm h3 { margin: 0 0 6px; font-size: 21px; }
  #confirm p { margin: 0 0 18px; color: var(--muted); }
  #confirm .row button { min-height: 62px; font-weight: 600; }
  #confirmYes { background: var(--red); border-color: var(--red); color: #fff; }

  .link { background: none; border: none; color: var(--muted); min-height: 0; font-size: 14px; padding: 8px; margin: 8px auto 0; text-decoration: underline; }
</style>
</head>
<body>

<!-- ===== PIN ===== -->
<div id="pinScreen">
  <h1>Laptop Remote</h1>
  <p>Enter the PIN shown in the black window on the laptop.</p>
  <form id="pinForm" autocomplete="off">
    <input id="pinInput" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="12"
           autocomplete="off" autocorrect="off" spellcheck="false" placeholder="PIN" aria-label="PIN">
    <button type="submit" class="primary">Connect</button>
  </form>
  <div id="pinError" role="alert"></div>
</div>

<!-- ===== MAIN SCREEN ===== -->
<div id="main">
  <header>
    <div>
      <h1>Laptop Remote</h1>
      <small id="laptopName">connecting…</small>
    </div>
    <div class="status" id="status" title="Connection to the laptop"></div>
  </header>

  <section>
    <h2>Music</h2>
    <div class="row">
      <button data-command="previous" aria-label="Previous track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg><span>Previous</span>
      </button>
      <button data-command="play_pause" class="primary big" aria-label="Play or pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14l8-7zM14 5h2.5v14H14zM18.5 5H21v14h-2.5z"/></svg><span>Play / Pause</span>
      </button>
      <button data-command="next" aria-label="Next track">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg><span>Next</span>
      </button>
    </div>
  </section>

  <section>
    <h2>Volume</h2>
    <div class="row">
      <button data-command="volume_down" data-hold aria-label="Volume down">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zM14 11h7v2h-7z"/></svg><span>Volume down</span>
      </button>
      <button data-command="mute" aria-label="Mute or unmute">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg><span>Mute</span>
      </button>
      <button data-command="volume_up" data-hold aria-label="Volume up">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9zM16 11h2.5V8.5h2V11H23v2h-2.5v2.5h-2V13H16z"/></svg><span>Volume up</span>
      </button>
    </div>
  </section>

  <section>
    <h2>Apps &amp; websites</h2>
    <div class="programs" id="programs"><p class="empty">Loading…</p></div>
    <div class="notes" id="notes"></div>
  </section>

  <section>
    <h2>Type text on the laptop</h2>
    <textarea id="text" maxlength="5000" placeholder="Write some text. The laptop will type it into the window that is active on it."></textarea>
    <div class="options">
      <label><input type="checkbox" id="enter"> Press Enter at the end</label>
      <button id="sendText" class="primary">Type</button>
    </div>
  </section>

  <section>
    <h2>System</h2>
    <div class="row">
      <button data-command="lock" aria-label="Lock screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H5v12h14V10h-2V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3zm3 3a2 2 0 0 1 1 3.7V19h-2v-2.3A2 2 0 0 1 12 13z"/></svg><span>Lock screen</span>
      </button>
      <button data-command="restart" data-confirm class="warn" aria-label="Restart the laptop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L7 5.5 12 10V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><span>Restart</span>
      </button>
      <button data-command="shutdown" data-confirm class="danger" aria-label="Shut down the laptop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2h2v10h-2zM6.3 5.3l1.4 1.4A7 7 0 1 0 16.3 6.7l1.4-1.4A9 9 0 1 1 6.3 5.3z"/></svg><span>Shut down</span>
      </button>
    </div>
  </section>

  <button class="link" id="changePin">Change PIN</button>
</div>

<!-- ===== CONFIRMATION ===== -->
<div id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="box">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="row two">
      <button id="confirmNo">Cancel</button>
      <button id="confirmYes"></button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let pin = "";
  try { pin = localStorage.getItem("pin") || ""; } catch (e) {}

  // ---------- short messages ----------
  let toastTimer;
  function toast(text, isError = false) {
    const el = $("toast");
    el.textContent = text;
    el.className = "visible" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.className = isError ? "error" : ""), isError ? 4000 : 1600);
  }
  function vibrate(ms = 15) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

  // ---------- requests to the laptop ----------
  async function request(path, body) {
    const options = { headers: { "X-PIN": pin }, cache: "no-store" };
    if (body) {
      options.method = "POST";
      options.headers["Content-Type"] = "application/json";
      options.body = JSON.stringify(body);
    }
    let res;
    try {
      res = await fetch(path, options);
    } catch (e) {
      $("status").className = "status error";
      throw new Error("No connection to the laptop. Is the server running, and are you on the same Wi-Fi?");
    }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) {
      showPin("Wrong PIN, or the PIN has changed. Enter the PIN from the window on the laptop.");
      throw new Error("Wrong PIN.");
    }
    if (!res.ok) throw new Error(data.error || "Error " + res.status);
    $("status").className = "status ok";
    return data;
  }

  async function command(body, quiet = false) {
    try {
      const r = await request("/api/command", body);
      if (!quiet) toast(r.message || "Done");
      return true;
    } catch (e) {
      toast(e.message, true);
      return false;
    }
  }

  // ---------- PIN ----------
  function showPin(error = "") {
    stopHold();
    closeConfirm();
    $("main").classList.remove("visible");
    $("pinScreen").classList.add("visible");
    $("pinError").textContent = error;
    $("pinInput").value = "";
  }

  async function connect() {
    try {
      const r = await request("/api/check");
      try { localStorage.setItem("pin", pin); } catch (e) {}
      $("pinScreen").classList.remove("visible");
      $("main").classList.add("visible");
      $("laptopName").textContent = "Connected: " + r.laptop + (r.test_mode ? " (test mode)" : "");
      loadPrograms();
    } catch (e) {
      if (!$("pinScreen").classList.contains("visible")) showPin();
      if (!$("pinError").textContent || !/Wrong PIN/.test(e.message)) $("pinError").textContent = e.message;
    }
  }

  $("pinForm").addEventListener("submit", (e) => {
    e.preventDefault();
    pin = $("pinInput").value.trim();
    if (!pin) return;
    $("pinError").textContent = "";
    connect();
  });
  $("changePin").addEventListener("click", () => {
    pin = "";
    try { localStorage.removeItem("pin"); } catch (e) {}
    showPin();
  });

  // ---------- apps & websites ----------
  async function loadPrograms() {
    const box = $("programs");
    try {
      const r = await request("/api/programs");
      box.replaceChildren();
      if (!r.programs.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "The list is empty. Add apps to config.ini on the laptop, then refresh this page.";
        box.appendChild(p);
      }
      for (const name of r.programs) {
        const b = document.createElement("button");
        b.textContent = name;
        b.addEventListener("click", () => { vibrate(); command({ command: "open", name }); });
        box.appendChild(b);
      }
      $("notes").textContent = (r.warnings || []).length ? "Warning from config.ini: " + r.warnings.join(" · ") : "";
    } catch (e) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = e.message;
      box.replaceChildren(p);
    }
  }

  // ---------- confirmation for shut down and restart ----------
  const confirmTexts = {
    shutdown: ["Shut down the laptop?", "The laptop will shut down in 5 seconds. Anything unsaved in open programs may be lost.", "Yes, shut down"],
    restart: ["Restart the laptop?", "The laptop will restart in 5 seconds. Anything unsaved in open programs may be lost.", "Yes, restart"],
  };
  let pendingConfirm = null;
  function askConfirm(k) {
    pendingConfirm = k;
    [$("confirmTitle").textContent, $("confirmText").textContent, $("confirmYes").textContent] = confirmTexts[k];
    $("confirm").classList.add("visible");
    vibrate(40);
  }
  function closeConfirm() { $("confirm").classList.remove("visible"); pendingConfirm = null; }
  $("confirmNo").addEventListener("click", closeConfirm);
  $("confirm").addEventListener("click", (e) => { if (e.target.id === "confirm") closeConfirm(); });
  $("confirmYes").addEventListener("click", () => {
    const k = pendingConfirm;
    closeConfirm();
    if (k) command({ command: k, confirmed: true });
  });

  // ---------- volume: tap = one step, hold = keeps changing while held ----------
  // The next request is sent only after the laptop answered the previous one.
  // Repeating stops as soon as you let go, as soon as something fails
  // (e.g. a wrong PIN), and after 15 seconds at the latest.
  let stopHold = () => {};
  function hold(b, k) {
    stopHold();
    let running = true;
    const start = Date.now();
    const stop = () => { running = false; b.classList.remove("held"); };
    stopHold = stop;
    b.classList.add("held");
    vibrate();
    (async () => {
      let ok = await command({ command: k }, true);
      await wait(450);
      while (ok && running && Date.now() - start < 15000) {
        ok = await command({ command: k }, true);
        await wait(120);
      }
      stop();
    })();
  }
  ["pointerup", "pointercancel", "blur"].forEach((t) => window.addEventListener(t, () => stopHold()));
  document.addEventListener("visibilitychange", () => stopHold());

  // ---------- buttons ----------
  document.querySelectorAll("button[data-command]").forEach((b) => {
    const k = b.dataset.command;
    if (b.hasAttribute("data-confirm")) {
      b.addEventListener("click", () => askConfirm(k));
    } else if (b.hasAttribute("data-hold")) {
      b.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        hold(b, k);
      });
      b.addEventListener("pointerleave", () => stopHold());
      b.addEventListener("contextmenu", (e) => e.preventDefault());
      // Keyboard (Enter/Space) — one step.
      b.addEventListener("click", (e) => { if (e.detail === 0) command({ command: k }, true); });
    } else {
      b.addEventListener("click", () => { vibrate(); command({ command: k }); });
    }
  });

  $("sendText").addEventListener("click", async () => {
    const text = $("text").value;
    if (!text) { toast("Write some text first.", true); return; }
    vibrate();
    $("sendText").disabled = true;
    const ok = await command({ command: "type", text, enter: $("enter").checked });
    $("sendText").disabled = false;
    if (ok) $("text").value = "";
  });

  // When you come back to the page, reload the app list (config.ini may have changed).
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && $("main").classList.contains("visible")) loadPrograms();
  });

  // ---------- start ----------
  if (pin) connect(); else showPin();
})();
</script>
</body>
</html>
