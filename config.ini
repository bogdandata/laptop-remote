; =====================================================================
;  Laptop Remote settings
;
;  Lines that start with ; are comments and have no effect.
;  After a change, save the file (Ctrl+S).
;   - Changes to [programs] apply right away: refresh the page on the phone.
;   - Changes to [server] apply the next time you start start.bat.
; =====================================================================

[server]
; Name of this laptop, shown on the phone. Empty = the Windows computer name.
name =

; Port the server uses. Change it only if this one is already taken.
port = 8765

; How much one tap changes the volume (1 = 2%, 2 = 4% ... up to 10).
volume_step = 1

; A phone that is not used for this many days is disconnected
; automatically (0 = never).
forget_phones_after_days = 30

; The same for phones and laptops that control this laptop from anywhere
; (section 8). Longer, so help from far away keeps working (0 = never).
forget_anywhere_after_days = 180

; Devices signed in to the same Tailscale account as this laptop may use the
; secure https link with no code (README, section 9). yes or no.
tailscale_auto_connect = yes

; Control from anywhere (any network, end-to-end encrypted), through a free
; Cloudflare tunnel. The first time, the remote downloads cloudflared.exe,
; Cloudflare's official tunnel program (README, section 8). yes or no.
anywhere = yes

; While Laptop Remote runs and the laptop is on its charger, Windows does
; not go to sleep by itself, so you can reach it from far away (the screen
; may still turn off). On battery the normal sleep settings apply. yes or no.
keep_awake = yes


[programs]
; Each line is one button on the phone:
;     Button name = path to a program, file or folder, or a web address
; Write the path without quotes (if you add them anyway, they are removed).
; %USERPROFILE% is your user folder, for example C:\Users\Mark

Notepad = notepad.exe
Calculator = calc.exe
Downloads = %USERPROFILE%\Downloads
YouTube = https://www.youtube.com
Google = https://www.google.com

; More examples — delete the ; at the start of a line to turn it on:
; Chrome = C:\Program Files\Google\Chrome\Application\chrome.exe
; VLC = C:\Program Files\VideoLAN\VLC\vlc.exe
; Spotify = %APPDATA%\Spotify\Spotify.exe
; Netflix = https://www.netflix.com
